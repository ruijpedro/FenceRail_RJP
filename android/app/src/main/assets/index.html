<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedações</title><style>
:root{--ip-green:#00843D;--ip-dark:#006B32;--ip-light:#E8F5EE;--mint:#bfe6d8;--bg:#f2f8f5;--text:#062322;--muted:#5e7370;--line:#c9e4dc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.hero{min-height:145px;background:linear-gradient(135deg,#fff 0%,#fff 56%,#9bd8c8 56%,#9bd8c8 100%);display:flex;align-items:center;gap:24px;padding:24px 32px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 12px 28px #006b3222}.hero img{width:155px;height:78px;object-fit:contain;background:#fff}.hero h1{font-size:40px;margin:0 0 10px;font-weight:900}.hero p{font-size:19px;margin:0 0 14px}.hero b{color:#00a987}.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:18px 10px}.tabs button,.card button{border:0;border-radius:22px;padding:14px 20px;background:#fff;color:var(--text);font-weight:900;font-size:16px;box-shadow:0 5px 16px #0001}.tabs .active,.primary{background:#1bb7a6!important;color:#fff!important}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:0 24px 18px;box-shadow:0 8px 18px #006b3210}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 24px 18px}.grid .card{margin:0}.stat span{display:block;color:var(--muted);font-weight:700}.stat b{font-size:32px;color:var(--ip-green);display:block;margin-top:8px}h2{font-size:28px;margin:0 0 18px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label span{display:block;font-weight:900;margin:4px 0 7px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #bdd8d0;border-radius:12px;font-size:15px;background:#fff}textarea{margin-top:14px;min-height:90px}.gpsbox{display:grid;grid-template-columns:180px 1fr 180px 1fr;gap:12px;align-items:center;margin-top:18px}.gpsbox span{background:var(--ip-light);border-radius:14px;padding:13px;min-height:54px}.metric{margin-top:14px;background:var(--ip-light);border-left:6px solid var(--ip-green);padding:14px;border-radius:14px;font-size:18px}.note{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e2efeb;text-align:left;padding:10px;vertical-align:top}th{background:#f1faf7}footer{text-align:center;color:var(--muted);padding:26px}.hidden{display:none}@media(max-width:760px){.hero{padding:18px;gap:12px;background:#fff}.hero img{width:115px}.hero h1{font-size:30px}.grid{grid-template-columns:1fr;margin:0 12px 14px}.card{margin:0 12px 14px}.gpsbox{grid-template-columns:1fr}.tabs button{flex:1 1 auto}}
</style></head><body><header class="hero"><img src="ip_logo.png" alt="IP"><div><h1>Vedações</h1><p>Cadastro, inspeção e levantamento GPS de vedações ferroviárias</p><b>Hub Manutenção IP · Autor RJP · Google Bridge</b></div></header><nav class="tabs" id="tabs"></nav><main id="app"></main><footer>Vedações · Hub Manutenção IP · Google Drive/Sheets/Calendar</footer><script>
const tabs={dashboard:'Dashboard',google:'Google Bridge',gps:'Levantamento GPS',registos:'Vedações',mapa:'Mapa',drive:'Drive',calendar:'Calendar',pdf:'PDF'};let tab='dashboard';let reg=JSON.parse(localStorage.getItem('vedacoes_registos')||'[]');let form={linha:'Linha do Oeste',troco:'',pkInicio:'',pkFim:'',lado:'Direito',tipoNorma:'Vedação Plena Via Zona Rural',tipologia:'Rede Electrossoldada',estado:'Bom',obs:'',acao:'',gpsInicio:'',gpsFim:'',comprimento:0};
function dist(a,b){if(!a||!b||!a.includes(',')||!b.includes(','))return 0;let[lat1,lon1]=a.split(',').map(Number),[lat2,lon2]=b.split(',').map(Number),R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,s1=Math.sin(dLat/2),s2=Math.sin(dLon/2),q=s1*s1+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*s2*s2;return Math.round(R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q)))}
function nav(){document.getElementById('tabs').innerHTML=Object.keys(tabs).map(k=>`<button class="${tab==k?'active':''}" onclick="tab='${k}';render()">${tabs[k]}</button>`).join('')}
function gps(k){navigator.geolocation.getCurrentPosition(p=>{form[k]=`${p.coords.latitude.toFixed(7)}, ${p.coords.longitude.toFixed(7)}`;form.comprimento=dist(form.gpsInicio,form.gpsFim);render()},()=>alert('Não foi possível obter GPS.'),{enableHighAccuracy:true,timeout:15000})}
function save(){form.comprimento=dist(form.gpsInicio,form.gpsFim);reg=[{...form,id:Date.now(),data:new Date().toLocaleString('pt-PT')},...reg];localStorage.setItem('vedacoes_registos',JSON.stringify(reg));form={...form,troco:'',pkInicio:'',pkFim:'',obs:'',acao:'',gpsInicio:'',gpsFim:'',comprimento:0};tab='registos';render()}
function set(k,v){form[k]=v}
function render(){nav();let app=document.getElementById('app');let metros=reg.reduce((a,r)=>a+(+r.comprimento||0),0),nc=reg.filter(r=>['Mau','Crítico'].includes(r.estado)).length;if(tab==='dashboard')app.innerHTML=`<section class="grid"><div class="card stat"><span>Troços inspecionados</span><b>${reg.length}</b></div><div class="card stat"><span>Metros levantados</span><b>${metros} m</b></div><div class="card stat"><span>NC abertas</span><b>${nc}</b></div><div class="card stat"><span>Fotos registadas</span><b>0</b></div></section><section class="card"><h2>Filosofia Hub Manutenção IP</h2><p>Visual verde IP, dados locais, Google Drive, Google Sheets, Google Calendar, PDF e botão Atualizar/Sincronizar.</p><button class="primary" onclick="tab='gps';render()">Novo levantamento GPS</button></section>`;
if(tab==='google')app.innerHTML=`<section class="card"><h2>Google Bridge</h2><pre>Hub_Manutencao_IP/\n └─ Vedacoes/\n    ├─ Fotos\n    ├─ PDFs\n    ├─ Relatorios\n    ├─ Mapas\n    └─ Backup</pre><button class="primary" onclick="alert('Sincronização preparada para Apps Script.')">☁️ Sincronizar com Google</button><button onclick="location.reload()">🔄 Atualizar Tudo</button></section>`;
if(tab==='gps')app.innerHTML=`<section class="card"><h2>Levantamento GPS do Troço</h2><div class="formgrid"><label><span>Linha</span><input value="${form.linha}" onchange="set('linha',this.value)"></label><label><span>Troço</span><input value="${form.troco}" onchange="set('troco',this.value)"></label><label><span>PK Inicial</span><input value="${form.pkInicio}" onchange="set('pkInicio',this.value)"></label><label><span>PK Final</span><input value="${form.pkFim}" onchange="set('pkFim',this.value)"></label><label><span>Lado</span><select onchange="set('lado',this.value)"><option>Direito</option><option>Esquerdo</option><option>Ambos</option></select></label><label><span>Estado</span><select onchange="set('estado',this.value)"><option>Bom</option><option>Razoável</option><option>Mau</option><option>Crítico</option></select></label></div><div class="gpsbox"><button onclick="gps('gpsInicio')">📍 Marcar Início</button><span>${form.gpsInicio||'GPS inicial por marcar'}</span><button onclick="gps('gpsFim')">📍 Marcar Fim</button><span>${form.gpsFim||'GPS final por marcar'}</span></div><div class="metric">Comprimento calculado: <b>${dist(form.gpsInicio,form.gpsFim)} m</b></div><textarea placeholder="Observações" onchange="set('obs',this.value)">${form.obs}</textarea><textarea placeholder="Ação corretiva" onchange="set('acao',this.value)">${form.acao}</textarea><button class="primary" onclick="save()">💾 Guardar registo</button></section>`;
if(tab==='registos')app.innerHTML=`<section class="card"><h2>Registos de Vedações</h2><table><thead><tr><th>Data</th><th>Troço</th><th>Estado</th><th>GPS</th><th>Compr.</th></tr></thead><tbody>${reg.map(r=>`<tr><td>${r.data}</td><td><b>${r.linha}</b><br>${r.troco}<br>PK ${r.pkInicio}-${r.pkFim}</td><td>${r.estado}</td><td>${r.gpsInicio}<br>${r.gpsFim}</td><td>${r.comprimento||0} m</td></tr>`).join('')}</tbody></table></section>`;
if(tab==='mapa')app.innerHTML=`<section class="card"><h2>Mapa</h2><button onclick="let r=reg.find(x=>x.gpsInicio);if(r)open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.gpsInicio))">🗺️ Abrir primeiro troço no Google Maps</button></section>`;
if(tab==='drive')app.innerHTML=`<section class="card"><h2>Google Drive</h2><p>Preparado para guardar PDFs, fotos, relatórios, mapas e backups.</p></section>`;if(tab==='calendar')app.innerHTML=`<section class="card"><h2>Google Calendar</h2><p>Eventos: Inspeção de Vedações, Reinspeção e Ação Corretiva.</p></section>`;if(tab==='pdf')app.innerHTML=`<section class="card"><h2>PDF / Excel</h2><button onclick="alert('Exportação PDF na versão React/WebApp completa.')">Gerar PDF</button><button onclick="alert('Exportação Excel na versão React/WebApp completa.')">Exportar Excel</button></section>`}
render();
</script></body></html>
